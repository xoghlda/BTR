<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>BTR 전체 흐름 연습 · 실제 증빙 아님</title>
<style>
body { font:18px/1.5 "Malgun Gothic",sans-serif; max-width:1000px; margin:32px auto; padding:0 24px; background:#f1f5f9; color:#14283e }
main { padding:28px; background:white; border:1px solid #cbd5e1; border-radius:12px }
strong { color:#9c2020 } label { display:block; margin:18px 0 } input { font:inherit; padding:9px; width:330px }
label span { display:inline-block; width:160px } button,a { font:inherit; padding:12px 18px; display:inline-block; margin:10px 14px 10px 0 }
button { cursor:pointer } #result { padding:18px; background:#eff6ff; white-space:pre-wrap }
</style><main>
<h1>전체 흐름 연습</h1>
<strong>SYNTHETIC DEVELOPMENT DATA · 실제 출장·지출 증빙이 아닙니다.</strong>
<p>인터넷·계정 없이 일반 입력, 조회 클릭, 새 영수증 창 전환과 화면 저장을 연습합니다. 실제 아이디·비밀번호를 입력하지 마세요.</p>
<label><span>개발용 출장일</span><input id="date" placeholder="예: 20261020"></label>
<label><span>개발용 출발지</span><input id="origin" placeholder="가상 출발지"></label>
<label><span>개발용 도착지</span><input id="destination" placeholder="가상 도착지"></label>
<button id="query">1. 조회 연습</button><button id="receipt">2. 새 영수증 창 열기</button>
<p id="result">조회 전입니다. 값을 입력하고 조회 연습을 누르세요.</p>
<p>흐름 예: 일반 입력 3개 → 클릭(조회) → 클릭(새 창) → 새 창 전환 → 화면 저장.</p>
<p>URL 이동·계정 자동 입력은 공식 HTTPS 사이트용입니다. 이 로컬 연습 파일에서는 일반 입력 단계만 사용하세요.</p>
</main><script>
let state = null;
const escape = value => value.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
document.getElementById('query').onclick = () => {
  state = ['date','origin','destination'].map(id => document.getElementById(id).value);
  document.getElementById('result').textContent = '개발용 입력 확인\n날짜: ' + state[0] + '\n구간: ' + state[1] + ' → ' + state[2] + '\n실제 예약·결제·영수증 발급은 하지 않았습니다.';
};
document.getElementById('receipt').onclick = () => {
  if (!state) { document.getElementById('result').textContent = '먼저 조회 연습을 누르세요.'; return; }
  const popup = window.open('', 'btr_workflow_synthetic_' + Date.now(), 'width=1000,height=800');
  if (!popup) { document.getElementById('result').textContent = '팝업 허용 후 다시 시도하세요.'; return; }
  popup.document.write('<!doctype html><html lang="ko"><meta charset="utf-8"><title>BTR 개발용 영수증 연습</title><style>body{font:22px/1.8 "Malgun Gothic",sans-serif;padding:45px}strong{color:#a11}article{border:2px solid #444;padding:28px}</style><h1>개발용 영수증 화면</h1><strong>SYNTHETIC DEVELOPMENT DATA · 실제 증빙 아님</strong><article><p>입력 날짜: ' + escape(state[0]) + '</p><p>가상 구간: ' + escape(state[1]) + ' → ' + escape(state[2]) + '</p><p>실제 운임·결제·승차 내역이 없습니다.</p><p>이 화면은 새 창 전환과 원본 화면 저장 기능을 확인하는 연습 자료입니다.</p></article></html>');
  popup.document.close();
};
</script></html>
